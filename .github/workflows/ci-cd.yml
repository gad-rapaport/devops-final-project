name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  IMAGE_BACKEND: ${{ secrets.DOCKER_HUB_USERNAME }}/smartrecipe-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKER_HUB_USERNAME }}/smartrecipe-frontend

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Run pytest against a real MySQL container
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Run pytest (DB + API)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: smartrecipe_test
          MYSQL_USER: smartrecipe
          MYSQL_PASSWORD: smartrecipe
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u smartrecipe --password=smartrecipe"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: mysql+pymysql://smartrecipe:smartrecipe@127.0.0.1:3307/smartrecipe_test
          GEMINI_API_KEY: test_key_placeholder
          SECRET_KEY: test-secret-key
        run: pytest --cov=app --cov-report=xml -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
        continue-on-error: true

      # שליחת מייל על כשלון בבדיקות
      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ CI FAILED — SmartRecipe AI tests failed on commit ${{ github.sha }}"
          to: ${{ secrets.MAIL_RECIPIENT }}
          from: SmartRecipe CI <${{ secrets.MAIL_USERNAME }}>
          body: |
            Pipeline failed at: Test stage
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Triggered by: ${{ github.actor }}

            View the failed run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Build and push Docker images to Docker Hub
  # ─────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_BACKEND }}:latest,${{ env.IMAGE_BACKEND }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_FRONTEND }}:latest,${{ env.IMAGE_FRONTEND }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ CI FAILED — Docker build/push failed on commit ${{ github.sha }}"
          to: ${{ secrets.MAIL_RECIPIENT }}
          from: SmartRecipe CI <${{ secrets.MAIL_USERNAME }}>
          body: |
            Pipeline failed at: Build & Push stage
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

            View the failed run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ─────────────────────────────────────────────────────────────────
  # Job 3: Deploy to Hetzner server via SSH
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          source: "docker-compose.yml,docker-compose.prod.yml,monitoring/,infrastructure/"
          target: "/opt/smartrecipe"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          script: |
            export IMAGE_TAG=sha-${{ github.sha }}
            export DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
            bash /opt/smartrecipe/infrastructure/deploy.sh

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ CD FAILED — Deployment to Hetzner failed on commit ${{ github.sha }}"
          to: ${{ secrets.MAIL_RECIPIENT }}
          from: SmartRecipe CI <${{ secrets.MAIL_USERNAME }}>
          body: |
            Pipeline failed at: Deploy stage
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Server: ${{ secrets.HETZNER_HOST }}

            View the failed run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ Deploy SUCCESS — SmartRecipe AI deployed: ${{ github.sha }}"
          to: ${{ secrets.MAIL_RECIPIENT }}
          from: SmartRecipe CI <${{ secrets.MAIL_USERNAME }}>
          body: |
            Deployment completed successfully!
            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}
            Triggered by: ${{ github.actor }}
            Server: ${{ secrets.HETZNER_HOST }}
